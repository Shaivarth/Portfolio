<style>
  .tryhackme-wrapper {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: calc(100vh - 240px);
    padding: 1.5rem 0;
  }

  /* Badge Wrapper & Fallback Card */
  .tryhackme-badge-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 400px;
    max-width: 100%;
    height: 172px;
    margin: 0 auto;
    border-radius: 8px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tryhackme-badge-wrapper:hover {
    transform: translateY(-2px);
  }

  .thm-native-card {
    position: relative;
    width: 400px;
    max-width: 100%;
    height: 172px;
    overflow: hidden;
    border: 1px solid #212c42;
    border-radius: 8px;
    background: #1c2538;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none !important;
    cursor: pointer;
  }

  .thm-watermark {
    position: absolute;
    width: 195px;
    height: 200px;
    fill: #212c42;
    transform: translate(-50%, -50%) rotate(-0.2deg);
    pointer-events: none;
  }

  .thm-watermark-right {
    left: calc(50% + 88.18px);
    top: calc(50% - 16.03px);
  }

  .thm-watermark-left {
    left: calc(50% - 204.68px);
    top: calc(50% + 24.99px);
  }

  .thm-card-domain {
    position: absolute;
    left: 22px;
    top: 20px;
    font-size: 10px;
    font-weight: 400;
    color: #878fa2;
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  .thm-card-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 1;
  }

  .thm-avatar-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    background-color: #212c42;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thm-avatar-img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  .thm-card-details {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .thm-username {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    color: #f9f9fb;
    letter-spacing: 0.01em;
  }

  .thm-stats {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .thm-stat {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .thm-stat-icon {
    width: 12px;
    height: 12px;
    opacity: 0.7;
  }

  .thm-stat-val {
    font-size: 12px;
    font-weight: 500;
    color: #9ca4b4;
    white-space: nowrap;
  }

  .thm-live-iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100% !important;
    height: 100% !important;
    max-width: 400px !important;
    border: none !important;
    border-radius: 8px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.3s ease;
    background: transparent;
  }

  .thm-live-iframe.is-loaded {
    opacity: 1;
  }

  @media (max-width: 440px) {
    .tryhackme-badge-wrapper {
      width: calc(100vw - 2.5rem);
      max-width: 360px;
      height: 155px;
    }
    .thm-native-card {
      width: 100%;
      height: 100%;
      transform: scale(0.92);
      transform-origin: center;
    }
  }

  /* Small heading just above badges */
  .thm-badges-heading {
    margin-top: 2rem;
    margin-bottom: 0.25rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: #fffef9;
    letter-spacing: 0.03em;
    user-select: none;
  }

  :is(.dark) .thm-badges-heading {
    color: #fffef9;
  }

  /* Horizontal line of all badges (no holder, no shadow) */
  .thm-badges-slider {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 1.65rem;
    width: 100%;
    max-width: 820px;
    margin-top: 0.35rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    white-space: nowrap;
    padding: 0.5rem 0.5rem;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }

  .thm-badges-slider::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  .thm-badges-slider:active {
    cursor: grabbing;
  }

  /* Badge item (only images, no square cards, no shadow) */
  .thm-badge-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .thm-badge-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: none !important;
    box-shadow: none !important;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .thm-badge-item:hover {
    transform: translateY(-4px) scale(1.15);
  }
</style>

<script>
  (function () {
    var slider = document.getElementById('thm-badges-slider');
    if (!slider) return;

    var isDown = false;
    var startX = 0;
    var scrollLeft = 0;

    slider.addEventListener('mousedown', function (e) {
      isDown = true;
      slider.classList.add('active');
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });

    slider.addEventListener('mouseleave', function () {
      isDown = false;
      slider.classList.remove('active');
    });

    slider.addEventListener('mouseup', function () {
      isDown = false;
      slider.classList.remove('active');
    });

    slider.addEventListener('mousemove', function (e) {
      if (!isDown) return;
      e.preventDefault();
      var x = e.pageX - slider.offsetLeft;
      var walk = (x - startX) * 1.6;
      slider.scrollLeft = scrollLeft - walk;
    });

    slider.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        slider.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  })();
</script>
{{ end }}
