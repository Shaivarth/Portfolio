{{ define "main" }}
<div class="tryhackme-wrapper flex flex-col items-center text-center">
  {{ if .Params.showBreadcrumbs | default (.Site.Params.list.showBreadcrumbs | default false) }}
  <header class="w-full text-center">
    {{ partial "breadcrumbs.html" . }}
  </header>
  {{ end }}

  <section class="w-full flex flex-col items-center text-center">
    <!-- Profile Badge Widget (clean, no holder, no shadow) -->
    <div class="tryhackme-badge-wrapper">
      {{ .Content }}
    </div>

    <!-- Horizontal Badges Slider (directly below, no holder, no shadow) -->
    {{ if .Params.badges }}
    <div class="thm-badges-heading">tryhackme badges</div>
    <div id="thm-badges-slider" class="thm-badges-slider">
      {{ range .Params.badges }}
      <div class="thm-badge-item flex-shrink-0" title="{{ .name }}">
        <img src="{{ .image }}" alt="{{ .name }}" class="thm-badge-img" loading="lazy" />
      </div>
      {{ end }}
    </div>
    {{ end }}
  </section>
</div>

<style>
  .tryhackme-wrapper {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: calc(100vh - 240px);
    padding: 1.5rem 0;
  }

  .tryhackme-badge-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 190px;
    line-height: 0;
    padding: 0;
    margin: 0;
    border: none !important;
    box-shadow: none !important;
  }

  .tryhackme-badge-wrapper iframe {
    display: block;
    max-width: 100% !important;
    border: none !important;
    border-radius: 0.75rem;
    box-shadow: none !important;
  }

  /* Small heading just above badges */
  .thm-badges-heading {
    margin-top: 2rem;
    margin-bottom: 0.25rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: #fffef9;
    letter-spacing: 0.03em;
    user-select: none;
  }

  :is(.dark) .thm-badges-heading {
    color: #fffef9;
  }

  /* Horizontal line of all badges (no holder, no shadow) */
  .thm-badges-slider {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 1.65rem;
    width: 100%;
    max-width: 820px;
    margin-top: 0.35rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    white-space: nowrap;
    padding: 0.5rem 0.5rem;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }

  .thm-badges-slider::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  .thm-badges-slider:active {
    cursor: grabbing;
  }

  /* Badge item (only images, no square cards, no shadow) */
  .thm-badge-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .thm-badge-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: none !important;
    box-shadow: none !important;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .thm-badge-item:hover {
    transform: translateY(-4px) scale(1.15);
  }
</style>

<script>
  (function () {
    var slider = document.getElementById('thm-badges-slider');
    if (!slider) return;

    var isDown = false;
    var startX = 0;
    var scrollLeft = 0;

    slider.addEventListener('mousedown', function (e) {
      isDown = true;
      slider.classList.add('active');
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });

    slider.addEventListener('mouseleave', function () {
      isDown = false;
      slider.classList.remove('active');
    });

    slider.addEventListener('mouseup', function () {
      isDown = false;
      slider.classList.remove('active');
    });

    slider.addEventListener('mousemove', function (e) {
      if (!isDown) return;
      e.preventDefault();
      var x = e.pageX - slider.offsetLeft;
      var walk = (x - startX) * 1.6;
      slider.scrollLeft = scrollLeft - walk;
    });

    slider.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        slider.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  })();
</script>
{{ end }}
