<style>
  /* Prevent horizontal scrollbars and disable browser default swipe-to-navigate (back/forward) */
  html,
  body {
    overflow-x: hidden;
    overscroll-behavior-x: none !important;
    overscroll-behavior: none !important;
    touch-action: pan-y;
  }

  /* Swipe entrance & exit animations */
  html.page-swipe-from-right #main-content {
    transform: translateX(45px);
    opacity: 0;
  }

  html.page-swipe-from-left #main-content {
    transform: translateX(-45px);
    opacity: 0;
  }

  html.page-swipe-ready #main-content {
    transform: translateX(0) !important;
    opacity: 1 !important;
    transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1), opacity 0.28s ease !important;
  }

  #main-content {
    will-change: transform, opacity;
  }

  /* Side swipe indicators */
  .swipe-side-indicator {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: default;
    user-select: none;
    pointer-events: auto;
    color: rgb(var(--color-primary-600, 124, 58, 237));
    opacity: 0.55;
    transition: opacity 0.25s ease, color 0.25s ease, transform 0.2s ease;
    padding: 0.4rem;
  }

  :is(.dark) .swipe-side-indicator {
    color: rgb(var(--color-primary-400, 167, 139, 250));
    opacity: 0.55;
  }

  .swipe-side-indicator:hover {
    opacity: 1;
    transform: translateY(-50%) scale(1.08);
  }

  :is(.dark) .swipe-side-indicator:hover {
    opacity: 1;
  }

  .swipe-side-left {
    left: 1.1rem;
  }

  .swipe-side-right {
    right: 1.1rem;
  }

  @media (max-width: 640px) {
    .swipe-side-left {
      left: 0.3rem;
    }
    .swipe-side-right {
      right: 0.3rem;
    }
  }

  .swipe-side-arrow {
    font-size: 2.45rem;
    font-weight: 300;
    line-height: 1;
    display: block;
  }

  .swipe-side-text {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1;
    display: none;
  }

  .swipe-side-indicator:hover .swipe-side-arrow {
    display: none;
  }

  .swipe-side-indicator:hover .swipe-side-text {
    display: block;
  }
</style>

<div id="swipe-side-left" class="swipe-side-indicator swipe-side-left" aria-hidden="true" style="display: none;">
  <span class="swipe-side-arrow">‹</span>
  <span class="swipe-side-text">swipe</span>
</div>

<div id="swipe-side-right" class="swipe-side-indicator swipe-side-right" aria-hidden="true" style="display: none;">
  <span class="swipe-side-arrow">›</span>
  <span class="swipe-side-text">swipe</span>
</div>


<script>
  // Immediate setup in <head> to prepare incoming slide animation before initial paint
  (function () {
    try {
      var dir = sessionStorage.getItem('page_swipe_dir');
      if (dir === 'left') {
        document.documentElement.classList.add('page-swipe-from-right');
      } else if (dir === 'right') {
        document.documentElement.classList.add('page-swipe-from-left');
      }
    } catch (e) { }
  })();

  document.addEventListener('DOMContentLoaded', function () {
    var ROUTES = ['/', '/about/', '/projects/', '/open-source/', '/connect/'];
    var isNavigating = false;
    var swipeTriggered = false;

    // Trigger entrance animation if arrived via swipe
    try {
      var dir = sessionStorage.getItem('page_swipe_dir');
      if (dir) {
        sessionStorage.removeItem('page_swipe_dir');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.documentElement.classList.add('page-swipe-ready');
            setTimeout(function () {
              document.documentElement.classList.remove('page-swipe-from-right', 'page-swipe-from-left', 'page-swipe-ready');
              var main = document.getElementById('main-content');
              if (main) {
                main.style.transform = '';
                main.style.opacity = '';
                main.style.transition = '';
              }
            }, 320);
          });
        });
      }
    } catch (e) { }

    // Clean up if restored from browser back/forward cache (bfcache)
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        document.documentElement.classList.remove('page-swipe-from-right', 'page-swipe-from-left', 'page-swipe-ready');
        var main = document.getElementById('main-content');
        if (main) {
          main.style.transform = '';
          main.style.opacity = '';
          main.style.transition = '';
        }
      }
    });

    function normalizePath(path) {
      if (!path) return '/';
      var p = path.split('?')[0].split('#')[0];
      p = p.replace(/\/index\.html$/, '/');
      if (p !== '/' && !p.endsWith('/')) {
        p += '/';
      }
      return p;
    }

    var currentPath = normalizePath(window.location.pathname);
    var currentIndex = ROUTES.indexOf(currentPath);

    var prevRoute = null;
    var nextRoute = null;

    if (currentIndex !== -1) {
      if (currentIndex > 0) prevRoute = ROUTES[currentIndex - 1];
      if (currentIndex < ROUTES.length - 1) nextRoute = ROUTES[currentIndex + 1];
    } else {
      if (currentPath.startsWith('/open-source/')) {
        prevRoute = '/open-source/';
        nextRoute = '/connect/';
      } else if (currentPath.startsWith('/projects/')) {
        prevRoute = '/projects/';
        nextRoute = '/open-source/';
      }
    }

    // Setup side swipe indicators (arrows that convert to 'swipe' on hover)
    var leftIndicator = document.getElementById('swipe-side-left');
    var rightIndicator = document.getElementById('swipe-side-right');

    if (leftIndicator && prevRoute) {
      leftIndicator.style.display = 'inline-flex';
    }
    if (rightIndicator && nextRoute) {
      rightIndicator.style.display = 'inline-flex';
    }

    // Explicitly make sure indicators are not clickable
    [leftIndicator, rightIndicator].forEach(function (el) {
      if (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
        });
      }
    });

    // Prefetch adjacent pages for zero-latency transitions
    [prevRoute, nextRoute].forEach(function (url) {
      if (url) {
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = url;
        document.head.appendChild(link);
      }
    });

    function rubberBand(direction) {
      var main = document.getElementById('main-content');
      if (!main) return;
      main.style.transition = 'transform 0.16s ease-out';
      main.style.transform = direction === 'right' ? 'translateX(20px)' : 'translateX(-20px)';
      setTimeout(function () {
        main.style.transition = 'transform 0.26s cubic-bezier(0.2, 0, 0, 1)';
        main.style.transform = 'translateX(0)';
        setTimeout(function () {
          main.style.transition = '';
          main.style.transform = '';
        }, 260);
      }, 160);
    }

    function navigateTo(targetUrl, direction) {
      if (isNavigating || !targetUrl) return;
      isNavigating = true;
      swipeTriggered = true;

      try {
        sessionStorage.setItem('page_swipe_dir', direction);
      } catch (e) { }

      var main = document.getElementById('main-content') || document.body;
      main.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1), opacity 0.22s ease';
      main.style.transform = direction === 'left' ? 'translateX(-50px)' : 'translateX(50px)';
      main.style.opacity = '0';

      setTimeout(function () {
        window.location.href = targetUrl;
      }, 200);
    }

    function handleSwipe(direction) {
      if (isNavigating) return;

      if (direction === 'left') {
        // Swiped left (finger / trackpad right-to-left) -> advance to Next page
        if (nextRoute) {
          navigateTo(nextRoute, 'left');
        } else {
          rubberBand('left');
        }
      } else if (direction === 'right') {
        // Swiped right (finger / trackpad left-to-right) -> retreat to Previous page
        if (prevRoute) {
          navigateTo(prevRoute, 'right');
        } else {
          rubberBand('right');
        }
      }
    }

    function isInteractive(el) {
      if (!el) return false;
      var tag = el.tagName ? el.tagName.toLowerCase() : '';
      if (['input', 'textarea', 'select', 'button'].includes(tag)) return true;
      var curr = el;
      while (curr && curr !== document.body && curr !== document.documentElement) {
        if (curr.scrollWidth > curr.clientWidth + 15) {
          var style = window.getComputedStyle(curr);
          if (style.overflowX === 'auto' || style.overflowX === 'scroll') {
            return true;
          }
        }
        curr = curr.parentElement;
      }
      return false;
    }

    // Determine device type: mobile/tablet vs laptop/desktop
    function isMobileOrTablet() {
      var hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      var isSmallScreen = window.innerWidth <= 1024;
      var mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Tablet/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return hasTouch && (isSmallScreen || mobileUA);
    }

    /* ------------------------------------------------------------------
       1. Mobile & Tablets: 1-Finger Horizontal Swipe (Reels style)
       2. Touchscreen Laptops: 2-Finger Horizontal Swipe
       ------------------------------------------------------------------ */
    var touchStartX = 0;
    var touchStartY = 0;
    var touchStartTime = 0;
    var touchFingerCount = 0;
    var isScrolling = null;

    window.addEventListener('touchstart', function (e) {
      touchFingerCount = e.touches.length;
      var mobile = isMobileOrTablet();

      // On mobile/tablets: exactly 1 finger
      // On laptops (with touchscreen): exactly 2 fingers
      if (mobile && touchFingerCount !== 1) return;
      if (!mobile && touchFingerCount !== 2) return;

      var x1 = e.touches[0].clientX;
      if (isInteractive(e.target)) return;

      touchStartX = x1;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      isScrolling = null;
    }, { passive: true });

    window.addEventListener('touchmove', function (e) {
      if (!touchStartTime) return;
      if (isScrolling === true) return;

      var mobile = isMobileOrTablet();
      if (mobile && e.touches.length !== 1) return;
      if (!mobile && e.touches.length !== 2) return;

      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;

      if (isScrolling === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        isScrolling = Math.abs(dy) >= Math.abs(dx);
      }

      // If horizontal swipe, prevent browser's default history back/forward navigation
      if (isScrolling === false) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', function (e) {
      if (!touchStartTime) return;
      var elapsed = Date.now() - touchStartTime;
      touchStartTime = 0;

      if (isScrolling === true) return;

      var mobile = isMobileOrTablet();
      if (mobile && touchFingerCount !== 1) return;
      if (!mobile && touchFingerCount !== 2) return;

      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy) * 1.3) {
        var threshold = mobile ? 45 : 60;
        var flickThreshold = mobile ? 28 : 40;
        if (Math.abs(dx) >= threshold || (Math.abs(dx) >= flickThreshold && elapsed < 350)) {
          if (dx < 0) {
            handleSwipe('left');
          } else {
            handleSwipe('right');
          }
        }
      }
    }, { passive: true });

    /* ------------------------------------------------------------------
       3. Laptop Trackpad: Two-Finger Horizontal Swipe
       Prevents browser's default back/forward swipe and triggers site navigation
       ------------------------------------------------------------------ */
    var wheelAccumulatorX = 0;
    var wheelTimeout = null;
    var wheelLock = false;

    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey) return; // Ignore pinch-to-zoom

      var absX = Math.abs(e.deltaX);
      var absY = Math.abs(e.deltaY);

      // Block the browser's default horizontal swipe-to-navigate action
      if (absX > absY && absX > 3) {
        if (!isInteractive(e.target)) {
          e.preventDefault();
        }
      }

      if (wheelLock || isNavigating) return;
      if (isInteractive(e.target)) return;

      // Detect two-finger horizontal trackpad gestures
      if (absX > absY * 1.25 && absX > 3) {
        wheelAccumulatorX += e.deltaX;

        clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(function () {
          wheelAccumulatorX = 0;
        }, 220);

        var TRACKPAD_THRESHOLD = 65;
        if (wheelAccumulatorX > TRACKPAD_THRESHOLD) {
          // Trackpad swiped two fingers left (pushing forward) -> go Next
          wheelLock = true;
          wheelAccumulatorX = 0;
          handleSwipe('left');
          setTimeout(function () { wheelLock = false; }, 800);
        } else if (wheelAccumulatorX < -TRACKPAD_THRESHOLD) {
          // Trackpad swiped two fingers right (pushing back) -> go Prev
          wheelLock = true;
          wheelAccumulatorX = 0;
          handleSwipe('right');
          setTimeout(function () { wheelLock = false; }, 800);
        }
      }
    }, { passive: false });

    /* ------------------------------------------------------------------
       4. Keyboard arrows (Left / Right) for desktop convenience
       ------------------------------------------------------------------ */
    window.addEventListener('keydown', function (e) {
      var tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (['input', 'textarea', 'select'].includes(tag) || (document.activeElement && document.activeElement.isContentEditable)) return;
      if (e.key === 'ArrowRight') {
        handleSwipe('left');
      } else if (e.key === 'ArrowLeft') {
        handleSwipe('right');
      }
    });

    // Suppress accidental link clicks after completing a swipe gesture
    window.addEventListener('click', function (e) {
      if (swipeTriggered) {
        e.preventDefault();
        e.stopPropagation();
        setTimeout(function () { swipeTriggered = false; }, 120);
      }
    }, true);
  });
</script>
