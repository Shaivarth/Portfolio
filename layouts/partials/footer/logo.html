<footer class="py-10 print:hidden">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm text-neutral-500 dark:text-neutral-400">
        {{ .Site.Copyright | default (printf "© %s %s" (now.Format "2006") .Site.Title) | emojify }}
      </p>
    </div>
    <div class="flex flex-row items-center text-sm text-neutral-500 dark:text-neutral-400">
      <a class="hover:text-primary-600 dark:hover:text-primary-400 decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2 transition-colors"
        target="_blank" rel="noopener noreferrer" href="https://github.com/gohugoio/hugo">
        Hugo
      </a>
      <span class="mx-1">&amp;</span>
      <a class="hover:text-primary-600 dark:hover:text-primary-400 decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2 transition-colors"
        target="_blank" rel="noopener noreferrer" href="https://github.com/jpanther/congo">
        Congo
      </a>
    </div>
  </div>
</footer>
