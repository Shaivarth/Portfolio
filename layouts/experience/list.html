{{ define "main" }}
<div class="experience-center-wrapper">
  <p class="experience-text">
    this space is reserved for your company's name.<br> all you have to do is hire me ;)
  </p>
</div>

<style>
  .experience-center-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 240px);
    width: 100%;
    padding: 2rem 1rem;
  }

  .experience-text {
    font-size: 1.45rem;
    font-weight: 400;
    line-height: 1.85;
    max-width: 620px;
    margin: 0 auto;
    letter-spacing: -0.01em;
    text-align: justify;
    text-justify: inter-word;
    color: #374151;
    transition: color 0.2s ease;
  }

  :is(.dark) .experience-text {
    color: #d4d4d8;
  }

  @media (max-width: 640px) {
    .experience-text {
      font-size: 1.2rem;
    }
  }
</style>
{{ end }}
